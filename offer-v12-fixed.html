<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SEAMLESS 2026 — The Somatic Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5eedb;--bg2:#e8dfc4;--text:#1a1712;--muted:#7a7060;--accent:#8a7230;}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(160deg,#f5eedb 0%,#e8dfc4 60%,#ddd0a8 100%);color:var(--text);font-family:'DM Sans',sans-serif}
#app{display:flex;height:100%;width:100%}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#main-canvas{display:block;width:100%;height:100%}

/* Header */
#header{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
#header h1{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--text);opacity:0.6}
#header .sub{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:-1px;opacity:0.5}

/* Controls panel */
/* Bottom bar — filters + range */
#bottom-bar{position:absolute;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,245,0.7);backdrop-filter:blur(10px);border-top:1px solid rgba(0,0,0,0.05);padding:8px 20px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#bottom-bar .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-right:4px}

#filter-cats{display:flex;flex-wrap:wrap;gap:3px}
#filter-cats label{display:flex;align-items:center;gap:3px;font-size:8.5px;cursor:pointer;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.06);transition:all 0.15s;white-space:nowrap}
#filter-cats label:hover{background:rgba(0,0,0,0.07)}
#filter-cats label.active{background:rgba(138,114,48,0.12);border-color:rgba(138,114,48,0.3)}
#filter-cats input{display:none}

/* Range slider inline */
#range-group{display:flex;align-items:center;gap:6px;flex:1;min-width:120px;max-width:280px}
#range-group .label{flex-shrink:0}
#range-wrap{position:relative;height:18px;flex:1}
#range-wrap input[type=range]{position:absolute;width:100%;height:0;top:9px;left:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;margin:0;padding:0}
#range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;border-radius:3px;background:var(--accent);border:1px solid rgba(0,0,0,0.1);cursor:pointer;pointer-events:auto;transition:transform 0.1s}
#range-wrap input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
#range-wrap input[type=range]::-moz-range-thumb{width:10px;height:14px;border-radius:3px;background:var(--accent);border:1px solid rgba(0,0,0,0.1);cursor:pointer;pointer-events:auto}
#range-track{position:absolute;top:9px;left:0;right:0;height:2px;background:rgba(0,0,0,0.08);border-radius:2px}
#range-fill{position:absolute;top:9px;height:2px;background:var(--accent);border-radius:2px;pointer-events:none}
#range-label{font-size:9px;font-family:'Space Mono',monospace;color:var(--accent);flex-shrink:0;min-width:70px;text-align:center}

/* Legend */
#legend{position:absolute;top:50px;left:12px;z-index:10;background:rgba(255,255,245,0.65);backdrop-filter:blur(8px);border-radius:10px;padding:8px 10px;border:1px solid rgba(255,255,240,0.8);font-size:9px;color:var(--muted)}
#legend .row{display:flex;align-items:center;gap:6px;margin:3px 0}
#legend .line{flex:0 0 24px;height:2px}
#legend .line.thick{height:3px;background:#c0392b;border-radius:1px}
#legend .line.dashed{border-top:2px dashed #2c3e50;background:transparent}
#legend .line.dotted{border-top:2px dotted #8e44ad;background:transparent}
#legend .line.arrow{height:2px;background:#27ae60}

/* Sidebar */
#sidebar{width:340px;background:rgba(255,255,245,0.85);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,240,0.9);padding:20px;overflow-y:auto;transition:transform .35s cubic-bezier(.4,0,.2,1);transform:translateX(0);z-index:20}
#sidebar.hidden{transform:translateX(100%);position:absolute;right:0;height:100%;border-left:none}
#sidebar .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
#sidebar h2{font-family:'Space Mono',monospace;font-size:15px;margin-bottom:3px;color:var(--text)}
#sidebar .cat{font-size:10px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
#sidebar .date{font-family:'Space Mono',monospace;font-size:12px;color:var(--accent);margin-bottom:10px}
#sidebar .desc{font-size:13px;line-height:1.7;color:var(--text)}
#sidebar .desc p{margin-bottom:8px}
#sidebar .connections{margin-top:12px;font-size:11px;color:var(--muted)}
#sidebar .connections span{display:inline-block;background:rgba(138,114,48,0.1);border-radius:10px;padding:2px 8px;margin:2px 3px;font-size:10px}

#toggle-sidebar{position:absolute;top:90px;right:0;z-index:15;background:rgba(255,255,245,0.7);backdrop-filter:blur(8px);border:none;border-radius:6px 0 0 6px;padding:6px 8px;cursor:pointer;font-size:16px;color:var(--muted);border:1px solid rgba(255,255,240,0.8);border-right:none;transition:right 0.35s cubic-bezier(.4,0,.2,1)}
#toggle-sidebar.push{right:340px}

/* SVG node styles */
.node{cursor:grab;user-select:none;touch-action:none}
.node:active{cursor:grabbing}
.node circle{transition:r .12s,stroke-width .12s,opacity .2s}
.node:hover circle{r:9;stroke-width:2.5}
.node text{pointer-events:none;font-size:9px;transition:opacity .2s}
.node.faded circle,.node.faded text{opacity:0.25 !important}
.link{pointer-events:none;transition:opacity .2s}
.link.faded{opacity:0 !important}

/* Count badge */
#count-badge{display:none}

@media(max-width:768px){
  #sidebar{width:100%;position:fixed;top:0;right:0;bottom:0;z-index:25}
  #sidebar.hidden{transform:translateX(100%)}
  #toggle-sidebar.push{right:0}
  #toggle-sidebar{top:80px}
  #bottom-bar{padding:6px 10px 8px;gap:4px;flex-direction:column;align-items:stretch}
  #range-group{max-width:100%}
  #legend{display:none}
}
</style>
</head>
<body>
<div id="app">
<div id="canvas-wrap">
  <div id="header">
    <h1>SEAMLESS 2026</h1>
    <div class="sub">The Somatic Universe</div>
  </div>
  <button id="toggle-sidebar" onclick="toggleSidebar()">☰</button>
  <svg id="main-canvas"></svg>

  <div id="bottom-bar">
    <div id="range-group">
      <span class="label">Years</span>
      <div id="range-wrap">
        <div id="range-track"></div>
        <div id="range-fill"></div>
        <input id="range-from" type="range" min="-40000" max="2026" value="-40000" step="1" oninput="onRange()">
        <input id="range-to" type="range" min="-40000" max="2026" value="2026" step="1" oninput="onRange()">
      </div>
      <div id="range-label"></div>
    </div>
    <span class="label">Filter</span>
    <div id="filter-cats"></div>
  </div>

  <div id="legend">
    <div class="row"><div class="line thick"></div> Historical Meeting</div>
    <div class="row"><div class="line dashed"></div> Influence</div>
    <div class="row"><div class="line dotted"></div> Contemporary</div>
    <div class="row"><div class="line arrow"></div> Teacher→Student</div>
  </div>
  <div id="count-badge"></div>
</div>
<div id="sidebar" class="hidden">
  <button class="close" onclick="toggleSidebar()">✕</button>
  <div id="sidebar-content">
    <div style="text-align:center;color:var(--muted);padding:60px 0;font-size:13px">Click a node to explore its story</div>
  </div>
</div>
</div>

<script>
// ===== DATA =====
const NODES=([
{id:"san",label:"San Trance Dance",cat:"ritual",year:-40000,story:"For 40,000+ years, the San people of the Kalahari have practiced healing trance dances. Around fire with rhythmic clapping, healers enter kia (altered state) activating n/um (spiritual energy) through shaking and vibrating. This is the oldest continuous movement practice on Earth — the primordial template for every somatic practice that followed."},
{id:"eleusis",label:"Eleusinian Mysteries",cat:"ritual",year:-1500,story:"For over 1000 years (1500 BCE–400 CE), initiates at Eleusis drank kykeon — a barley-based elixir now confirmed (Nature 2026) to contain ergot-derived psychedelics. The most sacred rite of Western civilization was a psychedelic-assisted mystical experience. Gordon Wasson and Albert Hofmann proposed this in 1978; a 2026 study proved ancient Greeks could process ergot into psychoactive lysergic acid amides."},
{id:"yoga",label:"Yoga / Kundalini",cat:"ritual",year:-3000,story:"The most systematized ancient practice linking breath, posture, and consciousness. 5000+ years of development in the Indus Valley produced a sophisticated technology of embodiment: asana, pranayama, meditation. Yoga's influence on Western somatics — from 19th-century Transcendentalists to 1960s counterculture to modern wellness — is immeasurable."},
{id:"sufi",label:"Sufi Whirling",cat:"ritual",year:1273,story:"The Mevlevi Order (Whirling Dervishes), founded by Rumi's followers in 13th-century Konya. The sema ceremony (UNESCO Intangible Heritage since 2008) is physically active meditation: spinning counter-clockwise, right palm up receiving divine energy, left palm down transmitting to earth. Directly influenced Gabrielle Roth's 5Rhythms, Gurdjieff's Sacred Dances, and modern ecstatic dance."},
{id:"capoeira",label:"Capoeira",cat:"ritual",year:1500,story:"Brazilian martial art disguised as dance, created by enslaved Africans as a form of resistance and cultural survival. Combines dance, acrobatics, music, and spirituality. Embodies the principle that movement can be simultaneously combat, art, community ritual, and political expression."},
{id:"darwin",label:"Darwin: Expression of Emotions",cat:"science",year:1872,story:"Charles Darwin's The Expression of the Emotions in Man and Animals proposed that emotional expressions are universal, evolved, and bodily — not cultural or mental. Directly inspired William James' body-first theory of emotion (1884). The scientific root of all embodied cognition theory."},
{id:"muybridge",label:"Muybridge: Animal Locomotion",cat:"science",year:1887,story:"Eadweard Muybridge's 19,000+ sequential photographs of human and animal movement — the first time movement could be scientifically analyzed frame by frame. Directly enabled biomechanics, kinesiology, and Rudolf Laban's movement analysis."},
{id:"james",label:"William James: Emotion",cat:"philosophy",year:1884,story:"William James published What is an Emotion? proposing the James-Lange theory: we feel fear because we run, not run because we fear. Emotion follows bodily changes. This was the first scientific articulation of embodied cognition — the body leads, the mind follows. Inspired by Darwin. Intellectual root of somatic psychology and Damasio's somatic marker hypothesis."},
{id:"duncan",label:"Isadora Duncan",cat:"dance",year:1900,story:"American dancer who rejected ballet's rigidity for 'natural' movement inspired by Greek art, nature, and emotion. Pioneered freeform expressive dance. Influenced by Nietzsche and Whitman. Direct ancestor of modern and postmodern dance."},
{id:"laban",label:"Rudolf Laban",cat:"science",year:1920,story:"Created Laban Movement Analysis (LMA) — the first comprehensive system for analyzing and notating human movement (Body, Effort, Shape, Space). His student Irmgard Bartenieff developed Bartenieff Fundamentals, a core somatic education practice. Laban's work underlies dance therapy, physical therapy, and performance analysis."},
{id:"graham",label:"Martha Graham",cat:"dance",year:1926,story:"Founded the oldest dance company in America (1926). Revolutionary technique based on contraction and release — the body expressing 'the interior landscape.' Mentored Merce Cunningham, Erick Hawkins, Paul Taylor. Her Greek Cycle (Clytemnestra, Medea, Cave of the Heart) connected modern dance to archetypal mythology — influenced by and influencing Joseph Campbell. Graham: 'Movement never lies.'"},
{id:"dewey",label:"Dewey: Art as Experience",cat:"philosophy",year:1934,story:"John Dewey's Art as Experience proposed aesthetic experience is continuous with life and grounded in bodily interaction with the environment. Provided the philosophical foundation for Black Mountain College (progressive education), postmodern performance, and embodied learning. Pragmatism + embodiment."},
{id:"akhilananda",label:"Swami Akhilananda Circle",cat:"philosophy",year:1940,story:"Swami Akhilananda's Vedanta circle in California (1940s–50s) included Aldous Huxley, Alan Watts, Gerald Heard, and Christopher Isherwood. This group — blending Hindu Vedanta, Western mysticism, and psychedelic exploration — was the intellectual seedbed for the 1960s counterculture and the Human Potential Movement."},
{id:"campbell",label:"Joseph Campbell",cat:"philosophy",year:1945,story:"Mythologist whose 'hero's journey' framework influenced everything from Star Wars to modern dance. Married Jean Erdman — former Martha Graham dancer who had Merce Cunningham in her first company. Co-founded Theater of the Open Eye (1972) with Erdman. Wrote: 'Art is the funnel through which spirit is poured into life.' Directly influenced Martha Graham's Greek myth choreography."},
{id:"bmc",label:"Black Mountain College",cat:"institution",year:1948,story:"The epicenter of the American avant-garde (1933–57). Founded on Dewey's progressive education. Cage met Suzuki (Zen) here. First 'Happening' (1952). Buckminster Fuller built geodesic domes. Cunningham founded his company (1953). Direct alumni: Rauschenberg, de Kooning, Olson, Richards. From BMC: Cage→Cunningham→Judson→Paxton→Contact Improvisation."},
{id:"cage",label:"John Cage",cat:"art",year:1952,story:"Met D.T. Suzuki at Columbia (1948–51) → Zen Buddhism → chance operations → 4'33\". Taught at Black Mountain College (1948, 1952, 1953). Created first 'Happening' at BMC (1952) with Cunningham, Rauschenberg, Tudor. Life partner and collaborator with Merce Cunningham. Cage's philosophy that 'everything is music' and silence is sound fundamentally reshaped modern art, dance, and performance."},
{id:"cunningham",label:"Merce Cunningham",cat:"dance",year:1953,story:"Danced with Martha Graham before partnering with John Cage. Founded Merce Cunningham Dance Company at Black Mountain College (1953). Collaborated with Rauschenberg (sets), Cage (music), Warhol. Pioneered chance choreography and the separation of dance from music. Judson Dance Theater emerged from his classes. Steve Paxton danced in his company before creating Contact Improvisation."},
{id:"huxley",label:"Huxley: Doors of Perception",cat:"psychedelic",year:1954,story:"In May 1953, Aldous Huxley took 400mg mescaline at his Hollywood Hills home. The Doors of Perception (1954) described his experience and became the intellectual cornerstone of the psychedelic movement. Coined 'psychedelic' with Humphry Osmond. Title borrowed from William Blake; later named The Doors band. Huxley introduced Alan Watts to Timothy Leary at Harvard. Influenced by Swami Akhilananda Vedanta circle."},
{id:"sabina",label:"Wasson + Maria Sabina",cat:"psychedelic",year:1955,story:"R. Gordon Wasson — banker and amateur mycologist — participated in a Mazatec healing velada with Maria Sabina in Huautla de Jiménez, Oaxaca (June 1955). Her all-night ceremony using 'the Holy Children' (psilocybin mushrooms) was published in LIFE Magazine (1957). Wasson and Albert Hofmann visited her together in 1962 — the discoverer of LSD meeting the shaman. This event catalyzed the Western psychedelic revolution."},
{id:"watts",label:"Alan Watts",cat:"philosophy",year:1955,story:"Buddhist scholar who popularized Zen for the counterculture. Involved with Swami Akhilananda circle (Huxley, Heard, Isherwood, 1951). Huxley introduced him to Leary at Harvard. Watts taught at Esalen. His synthesis of Zen, psychedelics, and Western philosophy shaped the spiritual vocabulary of the 1960s."},
{id:"esalen",label:"Esalen Institute",cat:"institution",year:1962,story:"The most important institution in the Somatic Universe. Founded 1962 by Michael Murphy and Richard Price with support from Watts, Huxley, Heard, and Bateson. Hosted: Fritz Perls (Gestalt), Alan Watts, Aldous Huxley, Timothy Leary, Stanislav Grof (who created Holotropic Breathwork here in 1975), Gabrielle Roth (who created 5Rhythms here), Ida Rolf, Moshe Feldenkrais. Esalen was where Eastern spirituality, Western psychology, and somatic practice physically converged and cross-pollinated. The 5Rhythms exists because Perls asked a dancer to teach movement to his Gestalt groups."},
{id:"judson",label:"Judson Dance Theater",cat:"institution",year:1962,story:"The most important dance collective of the 20th century (1962–64). Workshop at Judson Memorial Church, Greenwich Village. Core: Yvonne Rainer, Steve Paxton, Trisha Brown, Simone Forti, Lucinda Childs. Radical proposition: any movement can be dance. Emerging from Cunningham's classes at Black Mountain, Judson gave birth to Contact Improvisation (Paxton, 1972), Grand Union (1970–76), postmodern dance."},
{id:"pahnke",label:"Pahnke Good Friday",cat:"psychedelic",year:1962,story:"Walter Pahnke's Good Friday Experiment at Harvard (1962) — administered psilocybin to theology students at Boston University's Marsh Chapel. Designed by Leary's Harvard team, it tested whether psychedelics could produce genuine religious experience. Connected psychedelic science with Christian mysticism. A direct bridge between Leary's research and religion."},
{id:"leary",label:"Leary: Psychedelic Experience",cat:"psychedelic",year:1964,story:"Timothy Leary, Richard Alpert, and Ralph Metzner published The Psychedelic Experience: A Manual Based on the Tibetan Book of the Dead (1964). Dedicated to Huxley. Framed the psychedelic journey through Buddhism. The field guide for a generation of psychonauts. Leary conducted psilocybin research at Harvard until his dismissal in 1963. His 'turn on, tune in, drop out' became the counterculture slogan."},
{id:"perls",label:"Fritz Perls: Gestalt",cat:"therapy",year:1965,story:"Psychiatrist who integrated body awareness into psychotherapy. Founder of Gestalt therapy — emphasizing present-moment awareness, body sensation, and authentic encounter. Taught at Esalen (1960s). Invited Gabrielle Roth to teach movement to his Gestalt groups — directly catalyzing the creation of 5Rhythms."},
{id:"roth",label:"Gabrielle Roth: 5Rhythms",cat:"dance",year:1970,story:"Creator of 5Rhythms (Flowing, Staccato, Chaos, Lyrical, Stillness). Arrived at Esalen in her twenties; Fritz Perls invited her to teach movement to Gestalt groups. Drew from shamanism, Sufi whirling, ecstatic traditions, and human potential psychology. 5Rhythms is practiced globally as a movement meditation. Roth: 'The body is the soul presented in visible form.'"},
{id:"halprin",label:"Anna Halprin",cat:"dance",year:1970,story:"Postmodern dance pioneer who survived cancer through her own movement practice. Founded Tamalpa Institute (1978) — dance as healing. In 1981, she led a ritual on Mt. Tamalpais after a murder. Huichol shaman Don Jose Mitsuwa (then 109) told her: 'This mountain is sacred. You must dance for five years.' This created the Planetary Dance, still practiced globally. Halprin directly transmitted indigenous ceremonial healing into contemporary movement practice."},
{id:"paxton",label:"Steve Paxton: Contact Improv",cat:"dance",year:1972,story:"Dancer with Merce Cunningham, member of Judson Dance Theater and Grand Union. In 1972 at Oberlin College, he created Magnesium — 12 men falling, catching, colliding — which became Contact Improvisation. Influenced by Aikido's principles of blending with partner's energy. CI is now practiced worldwide as a postmodern dance form exploring shared weight, touch, and physical communication."},
{id:"openeve",label:"Campbell + Erdman: Open Eye",cat:"institution",year:1972,story:"Joseph Campbell and his wife Jean Erdman (former Martha Graham dancer) founded the Theater of the Open Eye in New York City (1972–1987). Presented dance, theater, and mythology as living ritual. Embodied Campbell's idea that 'the function of art is to render the invisible visible.' The direct institutional embodiment of myth + movement."},
{id:"grof",label:"Grof: Holotropic Breathwork",cat:"therapy",year:1975,story:"Stanislav Grof — Czech-born psychiatrist, pioneer of transpersonal psychology. Researched LSD psychotherapy in Czechoslovakia before moving to Esalen. In 1975 at Esalen, developed Holotropic Breathwork with his wife Christina — accelerated breathing + evocative music = non-ordinary states without substances. Proof that psychedelic terrain is accessible through breath and movement alone. Direct bridge between psychedelic therapy and somatic practice."},
{id:"planetary",label:"Halprin + Mitsuwa: Planetary Dance",cat:"dance",year:1981,story:"In 1981, Anna Halprin led a purification ritual on Mt. Tamalpais. Don Jose Mitsuwa, 109-year-old Huichol shaman, visited her and said this mountain is sacred and the ritual must continue for 5 years. Thus the Planetary Dance was born — a community healing ritual blending postmodern dance with indigenous shamanism. Still practiced globally today."},
{id:"mindlife",label:"Mind and Life Institute",cat:"institution",year:1987,story:"Founded by the Dalai Lama, Francisco Varela, and Adam Engle (1987). Direct meeting of Tibetan Buddhist contemplative tradition and Western cognitive science. Launched contemplative neuroscience. Funded Richard Davidson's EEG studies of meditating monks (gamma oscillations). The institutional bridge between meditation and neuroscience."},
{id:"varela",label:"Varela: The Embodied Mind",cat:"philosophy",year:1991,story:"Francisco Varela, Evan Thompson, Eleanor Rosch — The Embodied Mind (1991). Synthesized Merleau-Ponty's phenomenology, Maturana's biology of cognition, and Buddhist philosophy into enactivism: cognition emerges through dynamic coupling of organism and environment. Co-founded Mind and Life Institute with Dalai Lama. The most important 20th-century text in embodied cognitive science."},
{id:"damasio",label:"Damasio: Somatic Marker",cat:"science",year:1994,story:"Antonio Damasio's Descartes' Error (1994) proved through neuroscience that emotion, decision-making, and consciousness depend on body-state mapping. 'Somatic marker hypothesis': without body signals, there is no coherent self. Evidence for James' 1884 body-first theory. Directly informed by Antonio and Hanna Damasio's patient studies of ventromedial prefrontal cortex damage."},
{id:"porges",label:"Porges: Polyvagal Theory",cat:"science",year:1994,story:"Stephen Porges proposed three evolutionary layers of the autonomic nervous system: ventral vagal (social engagement), sympathetic (fight/flight), dorsal vagal (shutdown/shock). Revolutionary for understanding trauma, social behavior, and therapeutic movement. Explains why TRE, 5Rhythms, and Contact Improv work: they move the nervous system from dorsal through sympathetic to ventral vagal safety."},
{id:"tre",label:"TRE (Berceli)",cat:"therapy",year:2000,story:"Dr. David Berceli developed Tension & Trauma Releasing Exercises working in conflict zones across Africa and the Middle East. Watched San trance dancers and recognized neurogenic tremor as an evolutionary stress-release mechanism shared by all mammals. His 7 exercises activate tremor safely. 40,000-year-old San technology adapted for 21st-century clinical practice."},
{id:"dancepd",label:"Dance for PD",cat:"therapy",year:2001,story:"Founded by Mark Morris Dance Group (2001). 25+ years of evidence that partnered dance produces measurable neuroplasticity in Parkinson's patients. MRI studies show cortical reorganization after 6 months. Dance as medicine — proving artistic practice has direct neurological therapeutic value."},
{id:"interoception",label:"Interoception (Craig)",cat:"science",year:2002,story:"A.D. Craig's 2002 mapping of the lamina I spinothalamic pathway to the insula revealed interoception — the sense of the body's internal state — as the foundation of self-awareness. Higher interoceptive accuracy correlates with greater empathy but also anxiety. Interoception is trainable: somatic practices literally rewire the insula."},
{id:"semaunesco",label:"Dervish Sema: UNESCO",cat:"ritual",year:2008,story:"In 2008, the Mevlevi Sema ceremony was inscribed as UNESCO Intangible Cultural Heritage of Humanity. Recognition that Rumi's 13th-century whirling practice is not just art but a living somatic-spiritual technology with universal value."},
{id:"kruger",label:"Krüger: Trance Neuroscience",cat:"science",year:2022,story:"Armin Krüger's EEG studies of trance dancers (2022) show theta oscillations in the anterior cingulate cortex, prefrontal deactivation, and thalamocortical loops generating altered states. The San Bushman's 40,000-year-old practice now has a neurobiological description. Science catching up to shamanism."},
{id:"embodiedai",label:"Embodied AI (DeepMind)",cat:"science",year:2025,story:"DeepMind's sensorimotor AI learns through proprioceptive feedback — intelligence through body interaction. Rodney Brooks (1991) first argued 'intelligence without representation'; Rolf Pfeifer (2015) proposed 'bodyism.' Now embodied AI converges phenomenology (Merleau-Ponty, Varela) with robotics. Machines learning through movement — the computational frontier of somatics."},
{id:"kykeon2026",label:"Eleusis Kykeon Confirmed",cat:"science",year:2026,story:"2026 Nature Scientific Reports study confirmed the 1978 Wasson-Hofmann hypothesis: ancient Greeks could process ergot fungus (Claviceps purpurea) into psychoactive lysergic acid amides for the Eleusinian Mysteries' kykeon. The oldest secret rite in Western civilization was — as Huxley, Wasson, and Hofmann suspected — psychedelic."},
// === NEW NODES (43-48) ===
{id:"reich",label:"Wilhelm Reich",cat:"therapy",year:1935,story:"Wilhelm Reich (1897–1957) — Austrian psychiatrist and body psychotherapy pioneer. A student of Freud, Reich broke away to develop character analysis and the concept of 'body armor' — chronic muscular tension that stores emotional trauma. His Vegetotherapy (orgonomy) directly engaged the body through breath, touch, and expression. Though controversial (his orgone theories were rejected by mainstream science), Reich's core insight — that psychological defenses manifest physically — became foundational for Alexander Lowen's Bioenergetics (1950s), Gestalt therapy, Rolfing, and all modern body-centered psychotherapy. Persecuted by the U.S. government, Reich died in federal prison. His work circulates underground, increasingly validated by polyvagal and trauma research."},
{id:"gurdjieff",label:"Gurdjieff Sacred Dances",cat:"dance",year:1922,story:"G. I. Gurdjieff (1866–1949) — Armenian-Greek mystic who synthesized Eastern esoteric traditions into a practical system of self-development. His 'Movements' or Sacred Dances were taught at the Institute for the Harmonious Development of Man near Paris (founded 1922). Combining Sufi whirling, Caucasian folk dance, and Tibetan monastic movements, Gurdjieff designed precise choreography as a technology for awakening consciousness — moving the body to harmonize mind, emotion, and physical being. Directly influenced Gabrielle Roth (who studied his work) and the broader somatic movement. P. D. Ouspensky, his foremost student, documented the system. Gurdjieff claimed the dances originated from an ancient 'Sarmoung Monastery.'"},
{id:"openfloor",label:"Open Floor",cat:"dance",year:2006,story:"Open Floor International — founded in 2006 by Andrea Juhan and Kathy Altamirano (both longtime 5Rhythms teachers). While 5Rhythms follows a specific map (Flowing→Staccato→Chaos→Lyrical→Stillness), Open Floor offers a more flexible, inclusive framework for conscious dance. No fixed structure — each class explores a theme or quality through movement. Designed to be more accessible to trauma survivors, non-dancers, and those who find rigid maps constraining. Now taught in 20+ countries. Represents the democratization of somatic dance — moving from charismatic tradition to open-source practice."},
{id:"beat",label:"Beat Generation",cat:"psychedelic",year:1955,story:"The Beat Generation — Jack Kerouac, Allen Ginsberg, William S. Burroughs, Neal Cassady — redefined American consciousness through spontaneous prose, free verse, and psychedelic exploration. Ginsberg's Howl (1956) and Kerouac's On the Road (1957) embodied a new kind of embodied writing — the body speaking through rhythm, breath, and drugs. Burroughs, a lifelong opiate user, developed the 'cut-up' method. The Beats directly influenced (and were influenced by) Huxley, Zen Buddhism, and the San Francisco Renaissance. Ginsberg studied with Tibetan Buddhist teachers. The Beats were the literary wing of the psychedelic-somatic revolution — proving that altered consciousness could be rendered directly onto the page."},
{id:"ramdass",label:"Ram Dass",cat:"philosophy",year:1967,story:"Richard Alpert (1931–2019) — Harvard psychology professor fired alongside Timothy Leary for psychedelic research. In 1967, he traveled to India and met Neem Karoli Baba (Maharaj-ji), who gave him the name Ram Dass ('Servant of God'). His book Be Here Now (1971) — with its mix of psychedelic experience, Hindu bhakti yoga, and practical spirituality — became the manual for an entire generation. Ram Dass bridged Leary's psychedelic individualism with the devotional heart of Eastern spirituality. He later suffered a stroke (1997) and reframed it as his final lesson in embodiment — teaching about consciousness through a paralyzed body. His work at Esalen and the Human Potential Movement cemented the connection between psychedelics, Eastern philosophy, and embodied presence."},
{id:"stanislavski",label:"Stanislavski System",cat:"art",year:1900,story:"Konstantin Stanislavski (1863–1938) — Russian theater director who revolutionized acting by placing the actor's physical and emotional experience at the center of performance. His 'system' (developed 1890s–1930s) uses 'emotional memory,' 'physical actions,' and 'given circumstances' to generate authentic embodiment on stage. Stanislavski insisted that truthful acting comes from the body, not the mind: 'The external takes its direction from the internal, the internal from the external' — a fully somatic theory of performance. His students (Michael Chekhov, Lee Strasberg, Stella Adler) spread the System globally as Method Acting. Stanislavski's work anticipated embodied cognition by 100 years — treating the actor's body as the instrument of consciousness."}

// ===== MAP =====
const NODE_MAP={}; NODES.forEach(n=>NODE_MAP[n.id]=n);
const LINK_GLOB = LINKS; // keep closure ref

// ===== SVG SETUP =====
const SVG=document.getElementById('main-canvas');
const WRAP=document.getElementById('canvas-wrap');
let W=WRAP.clientWidth,H=WRAP.clientHeight;
let simulationActive=false;

// Constants
const YEAR_MIN=-40000,YEAR_MAX=2026;
const PAD_TOP=60,PAD_BOTTOM=70;
const PAD_LEFT=95,PAD_RIGHT=40;

function yearToY(y){return PAD_TOP+(1-(y-YEAR_MIN)/(YEAR_MAX-YEAR_MIN))*(H-PAD_TOP-PAD_BOTTOM)}
function yToYear(y){return YEAR_MIN + (1-(y-PAD_TOP)/(H-PAD_TOP-PAD_BOTTOM))*(YEAR_MAX-YEAR_MIN)}

// Epoch labels for axis
const EPOCHS=[
  {year:-40000,label:"40,000 BCE",era:"Deep Past"},{year:-3000,label:"3,000 BCE",era:"Antiquity"},
  {year:-1500,label:"1,500 BCE",era:""},{year:0,label:"0",era:"Classical"},
  {year:800,label:"800",era:""},{year:1273,label:"1273",era:"Medieval"},
  {year:1500,label:"1500",era:""},{year:1800,label:"1800",era:"Modern"},

  {year:2026,label:"2026",era:""}
];

// State
let nodeElements={};
let filterCats={};
let rangeFrom=YEAR_MIN, rangeTo=YEAR_MAX;
let draggedId=null,dragOffX=0,dragOffY=0;

// ===== FORCE SIMULATION =====
function initPositions(){
  NODES.forEach((n,i)=>{
    // Distribute horizontally with some randomness
    const col=i%6;
    const row=Math.floor(i/6);
    n._x=PAD_LEFT+30+col*((W-PAD_LEFT-PAD_RIGHT-60)/6)+Math.random()*30;
    n._y=yearToY(n.year)+(Math.random()-0.5)*20;
    n._vx=0;n._vy=0;
  });
}

function runForceSimulation(iterations){
  simulationActive=true;
  const kYear=0.03;        // spring to year
  const kAttract=0.00008;  // attraction between connected
  const kRepel=2000;       // repulsion strength
  const damping=0.85;
  const maxDist=180;
  
  for(let iter=0;iter<iterations;iter++){
    // Reset forces
    NODES.forEach(n=>{n._fx=0;n._fy=0});
    
    // Spring to year position
    NODES.forEach(n=>{
      const ty=yearToY(n.year);
      n._fy+=(ty-n._y)*kYear;
    });
    
    // Attraction between connected nodes
    LINK_GLOB.forEach(l=>{
      const a=NODE_MAP[l.from],b=NODE_MAP[l.to];
      if(!a||!b)return;
      const dx=b._x-a._x,dy=b._y-a._y;
      const dist=Math.sqrt(dx*dx+dy*dy)+1;
      const f=dist*kAttract;
      const fx=dx/dist*f, fy=dy/dist*f;
      a._fx+=fx;a._fy+=fy;
      b._fx-=fx;b._fy-=fy;
    });
    
    // Repulsion between all nearby nodes
    for(let i=0;i<NODES.length;i++){
      for(let j=i+1;j<NODES.length;j++){
        const a=NODES[i],b=NODES[j];
        const dx=a._x-b._x,dy=a._y-b._y;
        const dist=Math.sqrt(dx*dx+dy*dy)+1;
        if(dist>maxDist)continue;
        const f=kRepel/(dist*dist);
        const fx=dx/dist*f, fy=dy/dist*f;
        a._fx+=fx;a._fy+=fy;
        b._fx-=fx;b._fy-=fy;
      }
    }
    
    // Apply forces
    NODES.forEach(n=>{
      n._vx=(n._vx+n._fx)*damping;
      n._vy=(n._vy+n._fy)*damping;
      n._x+=n._vx;
      n._y+=n._vy;
      // Clamp
      n._x=Math.max(PAD_LEFT+5,Math.min(W-PAD_RIGHT-5,n._x));
      n._y=Math.max(PAD_TOP+5,Math.min(H-PAD_BOTTOM-5,n._y));
    });
  }
  simulationActive=false;
  render();
}

// ===== RENDERING =====
function render(){
  SVG.innerHTML='';
  const W2=W,H2=H;
  
  // Defs
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  
  // Arrow marker
  const marker=document.createElementNS('http://www.w3.org/2000/svg','marker');
  marker.setAttribute('id','arrow');
  marker.setAttribute('markerWidth','8');
  marker.setAttribute('markerHeight','6');
  marker.setAttribute('refX','8');
  marker.setAttribute('refY','3');
  marker.setAttribute('orient','auto');
  const arrowPath=document.createElementNS('http://www.w3.org/2000/svg','path');
  arrowPath.setAttribute('d','M0,0 L8,3 L0,6');
  arrowPath.setAttribute('fill','#27ae60');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  SVG.appendChild(defs);
  
  const grp=document.createElementNS('http://www.w3.org/2000/svg','g');
  
  // --- TIME AXIS (left) ---
  
  // Axis line (main vertical)
  const axisLine=document.createElementNS('http://www.w3.org/2000/svg','line');
  axisLine.setAttribute('x1',PAD_LEFT);
  axisLine.setAttribute('y1',PAD_TOP-10);
  axisLine.setAttribute('x2',PAD_LEFT);
  axisLine.setAttribute('y2',H2-PAD_BOTTOM+10);
  axisLine.setAttribute('stroke','rgba(0,0,0,0.15)');
  axisLine.setAttribute('stroke-width','2');
  grp.appendChild(axisLine);
  
  EPOCHS.forEach(ep=>{
    const ty=yearToY(ep.year);
    if(ty<PAD_TOP-10||ty>H2-PAD_BOTTOM+10)return;
    
    // Era background strip (for first of each era)
    if(ep.era){
      const strip=document.createElementNS('http://www.w3.org/2000/svg','rect');
      strip.setAttribute('x','0');
      strip.setAttribute('y',ty-1);
      strip.setAttribute('width',PAD_LEFT-8);
      strip.setAttribute('height','12');
      strip.setAttribute('fill','rgba(0,0,0,0.03)');
      strip.setAttribute('rx','2');
      grp.appendChild(strip);
      
      const eraTxt=document.createElementNS('http://www.w3.org/2000/svg','text');
      eraTxt.setAttribute('x','2');
      eraTxt.setAttribute('y',ty+8);
      eraTxt.setAttribute('font-size','7');
      eraTxt.setAttribute('fill','rgba(0,0,0,0.2)');
      eraTxt.setAttribute('font-family','Space Mono,monospace');
      eraTxt.setAttribute('text-anchor','start');
      eraTxt.textContent=ep.era;
      grp.appendChild(eraTxt);
    }
    
    // Grid line (subtle)
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',PAD_LEFT);
    line.setAttribute('y1',ty);
    line.setAttribute('x2',W2-PAD_RIGHT);
    line.setAttribute('y2',ty);
    line.setAttribute('stroke','rgba(0,0,0,0.04)');
    line.setAttribute('stroke-width','1');
    grp.appendChild(line);
    
    // Label + Tick
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',PAD_LEFT+6);
    txt.setAttribute('y',ty+3);
    txt.setAttribute('font-size','9');
    txt.setAttribute('font-weight','500');
    txt.setAttribute('fill','#5a5040');
    txt.setAttribute('text-anchor','start');
    txt.setAttribute('font-family','Space Mono,monospace');
    txt.textContent=ep.label;
    grp.appendChild(txt);
    
    const tick=document.createElementNS('http://www.w3.org/2000/svg','line');
    tick.setAttribute('x1',PAD_LEFT);
    tick.setAttribute('y1',ty);
    tick.setAttribute('x2',PAD_LEFT+4);
    tick.setAttribute('y2',ty);
    tick.setAttribute('stroke','rgba(0,0,0,0.2)');
    tick.setAttribute('stroke-width','1.5');
    grp.appendChild(tick);
  });
  
  // Determine visible nodes
  const visible={};
  NODES.forEach(n=>{
    const inRange=n.year>=rangeFrom&&n.year<=rangeTo;
    const inCat=!filterCats[n.cat];
    visible[n.id]=inRange&&inCat;
  });
  
  // --- LINKS (Bezier curves) ---
  LINK_GLOB.forEach(l=>{
    const a=NODE_MAP[l.from],b=NODE_MAP[l.to];
    if(!a||!b)return;
    if(!visible[a.id]||!visible[b.id])return;
    
    const x1=a._x,y1=a._y,x2=b._x,y2=b._y;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    // Control point offset based on distance
    const dx=x2-x1,dy=y2-y1;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    const ctrlOff=Math.min(dist*0.3,80);
    // Perpendicular offset
    const nx=-dy/dist,ny=dx/dist;
    const cx=mx+nx*ctrlOff,cy=my+ny*ctrlOff;
    
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const d='M'+x1+','+y1+' Q'+cx+','+cy+' '+x2+','+y2;
    path.setAttribute('d',d);
    path.setAttribute('fill','none');
    path.setAttribute('opacity','0.5');
    
    if(l.type==='historical_meeting'){
      path.setAttribute('stroke','#c0392b');
      path.setAttribute('stroke-width','2.5');
    }else if(l.type==='influence'){
      path.setAttribute('stroke','#2c3e50');
      path.setAttribute('stroke-width','1.2');
      path.setAttribute('stroke-dasharray','6,4');
    }else if(l.type==='same_time'){
      path.setAttribute('stroke','#8e44ad');
      path.setAttribute('stroke-width','1.2');
      path.setAttribute('stroke-dasharray','2,4');
    }else if(l.type==='teacher_student'){
      path.setAttribute('stroke','#27ae60');
      path.setAttribute('stroke-width','1.2');
      path.setAttribute('marker-end','url(#arrow)');
    }
    path.classList.add('link');
    path.dataset.from=l.from;
    path.dataset.to=l.to;
    grp.appendChild(path);
  });
  
  // --- NODES ---
  nodeElements={};
  const connectedTo={};
  LINK_GLOB.forEach(l=>{connectedTo[l.from]=(connectedTo[l.from]||0)+1;connectedTo[l.to]=(connectedTo[l.to]||0)+1;});
  
  // Sort: render nodes with more connections on top (drawn later)
  const sorted=[...NODES].sort((a,b)=>(connectedTo[a.id]||0)-(connectedTo[b.id]||0));
  
  sorted.forEach(n=>{
    const color=CAT_COLORS[n.cat]||'#999';
    const isVisible=visible[n.id];
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('node');
    g.dataset.id=n.id;
    
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',0);
    circle.setAttribute('cy',0);
    const r=connectedTo[n.id]&&connectedTo[n.id]>5?7:5;
    circle.setAttribute('r',r);
    circle.setAttribute('fill',color);
    circle.setAttribute('stroke','rgba(255,255,255,0.8)');
    circle.setAttribute('stroke-width','2');
    g.appendChild(circle);
    
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',r+5);
    txt.setAttribute('y',3);
    txt.setAttribute('font-size','9');
    txt.setAttribute('fill','#1a1712');
    txt.setAttribute('font-family','DM Sans,sans-serif');
    txt.textContent=n.label;
    g.appendChild(txt);
    
    g.setAttribute('transform','translate('+n._x.toFixed(1)+','+n._y.toFixed(1)+')');
    
    // Visibility
    if(!isVisible){
      circle.setAttribute('opacity','0');
      txt.setAttribute('opacity','0');
      g.style.pointerEvents='none';
    }
    
    // Click
    g.addEventListener('click',(e)=>{
      e.stopPropagation();
      if(!isVisible)return;
      showNode(n.id);
    });
    
    // --- DRAG with SVG pointer events ---
    g.addEventListener('pointerdown',(e)=>{
      e.stopPropagation();
      e.preventDefault();
      if(!isVisible)return;
      draggedId=n.id;
      const rect=WRAP.getBoundingClientRect();
      dragOffX=e.clientX-rect.left-parsedX(g.getAttribute('transform'));
      dragOffY=e.clientY-rect.top-parsedY(g.getAttribute('transform'));
      g.setPointerCapture(e.pointerId);
      g.style.cursor='grabbing';
    });
    
    grp.appendChild(g);
    nodeElements[n.id]=g;
  });
  
  SVG.appendChild(grp);
  updateBadge();
}

function parsedX(t){
  const m=t.match(/translate\(([^,]+)/);
  return m?parseFloat(m[1]):0;
}
function parsedY(t){
  const m=t.match(/translate\([^,]+,([^)]+)/);
  return m?parseFloat(m[1]):0;
}

// Pointer move/up on SVG
SVG.addEventListener('pointermove',(e)=>{
  if(!draggedId)return;
  const n=NODE_MAP[draggedId];
  if(!n)return;
  const rect=WRAP.getBoundingClientRect();
  const cx=e.clientX-rect.left-dragOffX;
  const cy=e.clientY-rect.top-dragOffY;
  n._x=Math.max(PAD_LEFT+5,Math.min(W-PAD_RIGHT-5,cx));
  n._y=Math.max(PAD_TOP+5,Math.min(H-PAD_BOTTOM-5,cy));
  const g=nodeElements[draggedId];
  if(g)g.setAttribute('transform','translate('+n._x.toFixed(1)+','+n._y.toFixed(1)+')');
  // Update links in real-time
  updateLinkPositions();
});

SVG.addEventListener('pointerup',()=>{
  if(draggedId){
    const g=nodeElements[draggedId];
    if(g)g.style.cursor='grab';
    draggedId=null;
  }
});

SVG.addEventListener('pointercancel',()=>{draggedId=null});

function updateLinkPositions(){
  const links=SVG.querySelectorAll('.link');
  links.forEach(path=>{
    const from=path.dataset.from,to=path.dataset.to;
    const a=NODE_MAP[from],b=NODE_MAP[to];
    if(!a||!b)return;
    const x1=a._x,y1=a._y,x2=b._x,y2=b._y;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const dx=x2-x1,dy=y2-y1;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    const ctrlOff=Math.min(dist*0.3,80);
    const nx=-dy/dist,ny=dx/dist;
    const cx=mx+nx*ctrlOff,cy=my+ny*ctrlOff;
    path.setAttribute('d','M'+x1.toFixed(1)+','+y1.toFixed(1)+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1));
  });
}

// ===== SIDEBAR =====
function showNode(id){
  const n=NODE_MAP[id];
  if(!n)return;
  const side=document.getElementById('sidebar');
  side.classList.remove('hidden');
  document.getElementById('toggle-sidebar').classList.add('push');
  const content=document.getElementById('sidebar-content');
  const color=CAT_COLORS[n.cat]||'#999';
  const connected=LINK_GLOB.filter(l=>l.from===id||l.to===id).map(l=>{
    const otherId=l.from===id?l.to:l.from;
    const other=NODE_MAP[otherId];
    return other?other.label:otherId;
  });
  
  let html='<h2 style="border-left:3px solid '+color+';padding-left:10px">'+escHtml(n.label)+'</h2>';
  html+='<div class="cat">'+(CAT_LABELS[n.cat]||n.cat)+'</div>';
  html+='<div class="date">'+(n.year<0?Math.abs(n.year)+' BCE':n.year+' CE')+'</div>';
  html+='<div class="desc">'+n.story.split('\n').map(p=>'<p>'+escHtml(p)+'</p>').join('')+'</div>';
  if(connected.length){
    const unique=[...new Set(connected)];
    html+='<div class="connections">Connections: '+unique.map(c=>'<span>'+escHtml(c)+'</span>').join('')+'</div>';
  }
  content.innerHTML=html;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('hidden');
  document.getElementById('toggle-sidebar').classList.toggle('push');
}

// ===== CATEGORY FILTERS =====
function buildCategoryUI(){
  const container=document.getElementById('filter-cats');
  Object.keys(CAT_LABELS).forEach(cat=>{
    const label=document.createElement('label');
    const dot=document.createElement('span');
    dot.style.cssText='display:inline-block;width:6px;height:6px;border-radius:50%;background:'+(CAT_COLORS[cat]||'#999')+';margin-right:1px';
    label.appendChild(dot);
    label.appendChild(document.createTextNode(CAT_LABELS[cat]));
    label.classList.add('active');
    label.addEventListener('click',()=>{
      filterCats[cat]=!filterCats[cat];
      label.classList.toggle('active');
      render();
    });
    container.appendChild(label);
  });
}

// ===== RANGE SLIDER =====
function onRange(){
  const fromInput=document.getElementById('range-from');
  const toInput=document.getElementById('range-to');
  let f=parseInt(fromInput.value),t=parseInt(toInput.value);
  if(f>=t){t=f+100;toInput.value=Math.min(t,2026);t=Math.min(t,2026);}
  if(t<=f){f=t-100;fromInput.value=Math.max(f,-40000);f=Math.max(f,-40000);}
  rangeFrom=f;rangeTo=t;
  
  // Fill
  const fill=document.getElementById('range-fill');
  const pctFrom=((f+40000)/42026)*100;
  const pctTo=((t+40000)/42026)*100;
  fill.style.left=pctFrom+'%';
  fill.style.width=(pctTo-pctFrom)+'%';
  
  // Label
  const fmt=(y)=>y<=0?Math.abs(y)+' BCE':y+' CE';
  document.getElementById('range-label').textContent=fmt(f)+' — '+fmt(t);
  
  render();
}

// ===== RESET LAYOUT =====
function resetLayout(){
  initPositions();
  runForceSimulation(100);
}

// ===== COUNT BADGE =====
function updateBadge(){
  const visible=NODES.filter(n=>n.year>=rangeFrom&&n.year<=rangeTo&&!filterCats[n.cat]);
  document.getElementById('count-badge').textContent=visible.length+' / '+NODES.length+' nodes';
}

// ===== RESIZE =====
function resize(){
  W=WRAP.clientWidth;
  H=WRAP.clientHeight;
  SVG.setAttribute('viewBox','0 0 '+W+' '+H);
  SVG.setAttribute('width',W);
  SVG.setAttribute('height',H);
  render();
}

// ===== INIT =====
function init(){
  buildCategoryUI();
  initPositions();
  runForceSimulation(100);
  resize();
  window.addEventListener('resize',resize);
  
  // Init range display
  onRange();
}

init();
</script>
</body>
</html>
